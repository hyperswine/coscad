# /opt/homebrew/etc/nginx/servers/manual.conf on the mac mini:
# serves the built manual on the tailnet; the public host proxies to it.
server {
    listen 6210;
    server_name manual.cswine.cloud _;
    root /Users/jq/srv/manual-www;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(png|css|js|json)$ { expires 10m; }
}
