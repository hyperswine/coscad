name: release

on:
  push:
    tags: ["v*"]
  # Candidate builds validate archives; pushing a version tag publishes them.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or candidate branch to build (push a v tag to publish)
        required: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: coscad-linux-x86_64
            container: debian:trixie
          # macos-latest (macos-26) pairs a CLT SDK with an older Xcode
          # linker: "tapi error ... unknown architecture arm64e.x1-macos".
          - os: macos-15
            artifact: coscad-macos-arm64
            container: ""
    steps:
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates xz-utils make gcc g++ pkg-config libgmp-dev zlib1g-dev libtinfo-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        id: hs
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.16.1.0"
      - name: Cache cabal
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'coscad.cabal',
                'third-party/manifold/include/**', 'third-party/manifold/src/**',
                'third-party/clipper2/CPP/**') }}
          restore-keys: ${{ runner.os }}-cabal-
      # The pinned native kernel (native-kernel.lock.json) is vendored under
      # third-party/ and linked statically into the released binary by cabal.
      - uses: ./.github/actions/setup-sol
      - run: cabal update
      - name: Build
        run: cabal build --enable-tests all
      # Every tier guards a release, including native geometry against the
      # goldens, on the exact binary that ships. OpenSCAD is only the test
      # oracle; it is switched off here and its checks run in ci.yml.
      - name: Test
        run: cabal test --test-show-details=direct
        env:
          COSCAD_OPENSCAD: none
      - name: Tag matches package version
        shell: sh
        run: |
          want="$(awk '/^version:/ { print $2 }' coscad.cabal)"
          case "$TAG" in v*) test "${TAG#v}" = "$want";; esac
          have=$(cabal run -v0 coscad -- --version | awk '{print $2}')
          test "$want" = "$have" || { echo "tag $TAG but coscad --version says $have"; exit 1; }
      - name: Install
        run: |
          mkdir -p dist-bin
          cp "$(cabal list-bin exe:coscad)" dist-bin/coscad
      - name: Sign macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist-bin/coscad
      - name: Package binary and native notices
        run: '"$SOL" scripts/package-release.sol --binary dist-bin/coscad'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/*
          if-no-files-found: error

  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coscad-vscode
          path: vscode/*.vsix

  publish:
    if: github.event_name == 'push'
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/**/*
          generate_release_notes: true
