name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: coscad-linux-x86_64
          - os: macos-latest
            artifact: coscad-macos-arm64
          - os: windows-latest
            artifact: coscad-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: hs
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.12"
      - name: Cache cabal
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'coscad.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-
      - run: cabal update
      - name: Build
        run: cabal build --enable-tests all
      # The pure tiers (diagnostics, examples, snapshots, CLI) guard every
      # release; the geometry tier needs OpenSCAD and runs in ci.yml.
      - name: Test
        run: cabal test --test-show-details=direct
        env:
          COSCAD_RENDER: "0"
      - name: Tag matches package version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(cabal run -v0 coscad -- --version | awk '{print $2}')
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but coscad --version says $have"; exit 1; }
      - name: Install
        run: cabal install exe:coscad --install-method=copy --overwrite-policy=always --installdir=dist-bin
      - name: Package
        shell: bash
        run: |
          mkdir -p "${{ matrix.artifact }}"
          cp dist-bin/coscad* README.md LICENSE CHANGELOG.md "${{ matrix.artifact }}/"
          cp -r docs "${{ matrix.artifact }}/docs"
          cp -r man "${{ matrix.artifact }}/man"
          cp -r examples "${{ matrix.artifact }}/examples"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          else
            tar czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
