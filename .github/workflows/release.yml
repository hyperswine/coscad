name: release

on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag with this workflow (e.g. after a runner image
  # change) without moving the tag, which would change the Formula sha256.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v1.3.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: coscad-linux-x86_64
          # macos-latest (macos-26) pairs a CLT SDK with an older Xcode
          # linker: "tapi error ... unknown architecture arm64e.x1-macos".
          - os: macos-15
            artifact: coscad-macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        id: hs
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.16.1.0"
      - name: Cache cabal
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'coscad.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-
      # The pinned native kernel (native-kernel.lock.json) is linked statically
      # into the released binary; macOS runners need pkg-config for the probe.
      - name: Kernel build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config cmake
      - name: Cache native kernel
        id: kernel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .native/manifold-3.5.2/install
          key: ${{ runner.os }}-native-kernel-${{ hashFiles('native-kernel.lock.json', 'scripts/build-manifold.py') }}
      - name: Build native kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: python3 scripts/build-manifold.py
      - name: Native kernel pkg-config
        shell: bash
        run: |
          echo "PKG_CONFIG_PATH=$PWD/.native/manifold-3.5.2/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$PWD/.native/manifold-3.5.2/install/lib/pkgconfig" pkg-config --modversion manifold Clipper2
      - run: cabal update
      - name: Build
        run: cabal build --enable-tests all
      # The pure tiers (diagnostics, examples, snapshots, CLI) and the native
      # kernel checks guard every release; the geometry tier needs OpenSCAD
      # and runs in ci.yml.
      - name: Test
        run: cabal test --test-show-details=direct
        env:
          COSCAD_RENDER: "0"
      - name: Tag matches package version
        shell: bash
        run: |
          want="${TAG#v}"
          have=$(cabal run -v0 coscad -- --version | awk '{print $2}')
          test "$want" = "$have" || { echo "tag $TAG but coscad --version says $have"; exit 1; }
      - name: Install
        run: cabal install exe:coscad --install-method=copy --overwrite-policy=always --installdir=dist-bin
      - name: Package
        shell: bash
        run: |
          mkdir -p "${{ matrix.artifact }}"
          cp dist-bin/coscad* README.md LICENSE CHANGELOG.md "${{ matrix.artifact }}/"
          cp -r docs "${{ matrix.artifact }}/docs"
          cp -r man "${{ matrix.artifact }}/man"
          cp -r examples "${{ matrix.artifact }}/examples"
          tar czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coscad-vscode
          path: vscode/*.vsix

  publish:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/**/*
          generate_release_notes: true
