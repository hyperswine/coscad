name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # stack.yaml uses system-ghc, so install the snapshot's GHC here.
      - uses: haskell-actions/setup@v2
        id: hs
        with:
          ghc-version: "9.8.2"
          enable-stack: true
          stack-version: "latest"

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hs.outputs.stack-root }}
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: ${{ runner.os }}-stack-

      # --- OpenSCAD + BOSL2 (the geometry tier renders every example) ---
      - name: OpenSCAD + BOSL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          printf '#!/bin/sh\nexec xvfb-run -a openscad "$@"\n' | sudo tee /usr/local/bin/openscad-headless >/dev/null
          sudo chmod +x /usr/local/bin/openscad-headless
          echo "COSCAD_OPENSCAD=/usr/local/bin/openscad-headless" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/BelfrySCAD/BOSL2 "$HOME/BOSL2"
          echo "COSCAD_BOSL2=$HOME/BOSL2" >> "$GITHUB_ENV"

      - name: OpenSCAD + BOSL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask openscad
          git clone --depth 1 https://github.com/BelfrySCAD/BOSL2 "$HOME/BOSL2"
          echo "COSCAD_BOSL2=$HOME/BOSL2" >> "$GITHUB_ENV"

      - name: OpenSCAD + BOSL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openscad --no-progress -y
          git clone --depth 1 https://github.com/BelfrySCAD/BOSL2 "$env:USERPROFILE\BOSL2"
          "COSCAD_BOSL2=$env:USERPROFILE\BOSL2" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: stack build --test --no-run-tests
      - name: coscad doctor
        run: stack exec coscad -- doctor
      - name: tests (diagnostics, examples, snapshots, geometry)
        run: stack test
