name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only: coscad targets macOS and Linux, and Windows is not a
        # supported platform. The release workflow builds and tests macOS.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        id: hs
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.16.1.0"

      - name: Cache cabal
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'coscad.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-

      # --- OpenSCAD + BOSL2: the test suite's independent oracle only. The
      # compiler never runs them; the no-openscad job below proves it. ---
      - name: OpenSCAD + BOSL2 oracle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          printf '#!/bin/sh\nexec xvfb-run -a openscad "$@"\n' | sudo tee /usr/local/bin/openscad-headless >/dev/null
          sudo chmod +x /usr/local/bin/openscad-headless
          echo "COSCAD_OPENSCAD=/usr/local/bin/openscad-headless" >> "$GITHUB_ENV"
          git init "$HOME/BOSL2"
          git -C "$HOME/BOSL2" remote add origin https://github.com/BelfrySCAD/BOSL2
          git -C "$HOME/BOSL2" fetch --depth 1 origin e173fa0ae45f9e2082e0d8c0382dae98621b7c20
          git -C "$HOME/BOSL2" checkout --detach FETCH_HEAD
          echo "COSCAD_BOSL2=$HOME/BOSL2" >> "$GITHUB_ENV"

      # --- pinned native kernel (native-kernel.lock.json: Manifold 3.5.2 +
      # Clipper2), required by every build. The static install is cached
      # by the lock and the builder; a miss rebuilds it from the pinned sources.
      - name: Cache native kernel
        id: kernel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .native/manifold-3.5.2/install
          key: ${{ runner.os }}-native-kernel-${{ hashFiles('native-kernel.lock.json', 'scripts/build-manifold.py') }}
      - name: Build native kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: python3 scripts/build-manifold.py
      - name: Native kernel pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$PWD/.native/manifold-3.5.2/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$PWD/.native/manifold-3.5.2/install/lib/pkgconfig" pkg-config --modversion manifold Clipper2

      - name: Pin policy and refusal checks
        run: |
          python3 scripts/pipeline-lock.py --check-ci
          python3 scripts/test-pipeline-lock.py
      # README, man page and --help must agree on commands and exit codes.
      - name: docs agree
        run: python3 scripts/check-docs.py
      # Offline: presets and the slicer are mocked, no Bambu Studio needed.
      # unittest, not bare asserts, so nothing is stripped under -O.
      - name: bambu-slice tests
        run: python3 -m unittest -v scripts/test-bambu-slice.py scripts/test-bambu-preflight.py
      # Warnings are errors in CI only: a newer GHC with new warnings must
      # not break a user's `cabal build`, but nothing new lands warning.
      - name: Warnings are errors (CI only)
        run: |
          printf 'package coscad\n  ghc-options: -Werror\n' > cabal.project.local
      - run: cabal update
      - run: cabal build --enable-tests all
      - name: coscad doctor
        run: cabal run coscad -- doctor
      - name: tests (diagnostics, examples, snapshots, native geometry, OpenSCAD oracle, cli)
        run: cabal test --test-show-details=direct

  # Users need no OpenSCAD: the full suite runs with the oracle switched off
  # (COSCAD_OPENSCAD=none) and no OpenSCAD installed. Every tier except the
  # OpenSCAD oracle checks must pass, and those must announce their skip.
  no-openscad:
    name: ubuntu-latest (no OpenSCAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        id: hs
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.16.1.0"
      - name: Cache cabal
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'coscad.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-
      - name: Cache native kernel
        id: kernel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .native/manifold-3.5.2/install
          key: ${{ runner.os }}-native-kernel-${{ hashFiles('native-kernel.lock.json', 'scripts/build-manifold.py') }}
      - name: Build native kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: python3 scripts/build-manifold.py
      - name: Native kernel pkg-config
        run: echo "PKG_CONFIG_PATH=$PWD/.native/manifold-3.5.2/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Warnings are errors (CI only)
        run: |
          printf 'package coscad\n  ghc-options: -Werror\n' > cabal.project.local
      - run: cabal update
      - run: cabal build --enable-tests all
      - name: openscad is not installed
        run: "! command -v openscad"
      - name: coscad doctor
        run: cabal run coscad -- doctor
      - name: tests with the OpenSCAD oracle off
        run: |
          set -o pipefail
          cabal test coscad-test --test-show-details=direct | tee suite.log
          grep -q "OpenSCAD oracle checks skipped" suite.log
        env:
          COSCAD_OPENSCAD: none

  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
